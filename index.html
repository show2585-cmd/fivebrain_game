<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QV6KHX6B59"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-QV6KHX6B59');
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 기본 SEO ({{...}}는 빌드 시 src/seo/content.ts와 .env 값으로 치환) -->
    <title>{{SITE_TITLE}}</title>
    <meta name="description" content="{{SITE_DESCRIPTION}}" />
    <meta name="keywords" content="{{SITE_KEYWORDS}}" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="{{SITE_URL}}" />
    <meta name="author" content="{{SITE_NAME}}" />
    <meta name="format-detection" content="telephone=no" />

    <!-- 검색엔진 소유 확인: 발급받은 코드로 주석을 풀어 사용 -->
    <!-- <meta name="google-site-verification" content="" /> -->
    <!-- <meta name="naver-site-verification" content="" /> -->

    <!-- 공유 미리보기 (카카오톡, 페이스북, 디스코드 등) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{SITE_NAME}}" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="{{SITE_URL}}" />
    <meta property="og:title" content="{{SITE_TITLE}}" />
    <meta property="og:description" content="{{SITE_DESCRIPTION}}" />
    <meta property="og:image" content="{{SITE_URL}}og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{SITE_NAME}} - {{SITE_TAGLINE}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SITE_TITLE}}" />
    <meta name="twitter:description" content="{{SITE_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{SITE_URL}}og-image.png" />

    <!-- 아이콘 / 앱 설치 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3a2213" />
    <meta name="application-name" content="{{SITE_NAME}}" />
    <meta name="apple-mobile-web-app-title" content="{{SITE_NAME}}" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- seo:jsonld -->
  </head>
  <body>
    <div id="root"><!-- seo:fallback --></div>
    <noscript>
      <p style="color:#fff4d6;text-align:center;padding:16px">자바스크립트를 켜면 게임을 플레이할 수 있어요.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
